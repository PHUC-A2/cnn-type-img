{# Phân trang admin — giữ query string #}
{% if page_result.total_pages > 1 %}
<div class="px-5 py-4 border-t border-[#E2E8F0] flex items-center justify-between gap-3">
    <p class="text-sm text-[#94A3B8]">Trang {{ page_result.page }} / {{ page_result.total_pages }} · {{ page_result.total_count }} bản ghi</p>
    <div class="flex gap-2">
        {% if page_result.has_prev %}
        <a href="?{{ prev_page_qs }}" class="aurora-btn aurora-btn-secondary !py-1.5 !px-3 text-xs">Trước</a>
        {% endif %}
        {% if page_result.has_next %}
        <a href="?{{ next_page_qs }}" class="aurora-btn aurora-btn-secondary !py-1.5 !px-3 text-xs">Sau</a>
        {% endif %}
    </div>
</div>
{% endif %}
