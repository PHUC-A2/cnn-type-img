{# Thanh điều hướng admin panel #}
<div class="aurora-card p-3 mb-5 overflow-x-auto">
    <div class="flex flex-wrap gap-2 min-w-max">
        <a href="{% url 'monitoring:dashboard' %}"
           class="aurora-btn {% if admin_section == 'dashboard' %}aurora-btn-primary{% else %}aurora-btn-secondary{% endif %} !py-1.5 !px-3 text-xs">
            <i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i>
            Tổng quan
        </a>
        <a href="{% url 'monitoring:users_list' %}"
           class="aurora-btn {% if admin_section == 'users' %}aurora-btn-primary{% else %}aurora-btn-secondary{% endif %} !py-1.5 !px-3 text-xs">
            <i data-lucide="users" class="w-3.5 h-3.5"></i>
            Người dùng
        </a>
        <a href="{% url 'monitoring:datasets_list' %}"
           class="aurora-btn {% if admin_section == 'datasets' %}aurora-btn-primary{% else %}aurora-btn-secondary{% endif %} !py-1.5 !px-3 text-xs">
            <i data-lucide="database" class="w-3.5 h-3.5"></i>
            Bộ dữ liệu
        </a>
        <a href="{% url 'monitoring:models_list' %}"
           class="aurora-btn {% if admin_section == 'models' %}aurora-btn-primary{% else %}aurora-btn-secondary{% endif %} !py-1.5 !px-3 text-xs">
            <i data-lucide="brain" class="w-3.5 h-3.5"></i>
            Mô hình
        </a>
        <a href="{% url 'monitoring:training_list' %}"
           class="aurora-btn {% if admin_section == 'training' %}aurora-btn-primary{% else %}aurora-btn-secondary{% endif %} !py-1.5 !px-3 text-xs">
            <i data-lucide="cpu" class="w-3.5 h-3.5"></i>
            Huấn luyện
        </a>
        <a href="{% url 'monitoring:predictions_list' %}"
           class="aurora-btn {% if admin_section == 'predictions' %}aurora-btn-primary{% else %}aurora-btn-secondary{% endif %} !py-1.5 !px-3 text-xs">
            <i data-lucide="scan-eye" class="w-3.5 h-3.5"></i>
            Phân loại
        </a>
        <a href="{% url 'monitoring:logs' %}"
           class="aurora-btn {% if admin_section == 'logs' %}aurora-btn-primary{% else %}aurora-btn-secondary{% endif %} !py-1.5 !px-3 text-xs">
            <i data-lucide="scroll-text" class="w-3.5 h-3.5"></i>
            Log
        </a>
    </div>
</div>
