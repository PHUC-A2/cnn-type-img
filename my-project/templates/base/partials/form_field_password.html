{# Field mật khẩu — có nút hiện/ẩn #}
<div>
    <label class="aurora-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    <div class="password-field relative">
        <input
            type="password"
            name="{{ field.html_name }}"
            id="{{ field.id_for_label }}"
            placeholder="{{ field.field.widget.attrs.placeholder|default:'' }}"
            autocomplete="{{ field.field.widget.attrs.autocomplete|default:'off' }}"
            data-field="{{ field.name }}"
            :class="fieldClass('{{ field.name }}') + ' pr-11'"
            @input="onInput('{{ field.name }}')"
            @blur="onBlur('{{ field.name }}')"
        >
        <button
            type="button"
            class="password-toggle"
            @click="togglePassword($event)"
            aria-label="Hiện/ẩn mật khẩu"
            title="Hiện/ẩn mật khẩu"
        >
            <i data-toggle-icon data-lucide="eye" class="w-4 h-4"></i>
        </button>
    </div>
    <p x-show="showError('{{ field.name }}')" x-cloak class="field-error-msg" x-text="errors['{{ field.name }}']"></p>
</div>
