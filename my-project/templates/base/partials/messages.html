{% if messages %}
<div class="mb-5 space-y-2">
    {% for message in messages %}
    <div class="aurora-alert {% if message.tags == 'error' %}aurora-alert-error{% elif message.tags == 'success' %}aurora-alert-success{% else %}aurora-alert-info{% endif %}">
        <i data-lucide="{% if message.tags == 'error' %}x-circle{% elif message.tags == 'success' %}check-circle-2{% else %}info{% endif %}" class="w-4 h-4 flex-shrink-0"></i>
        <span>{{ message }}</span>
    </div>
    {% endfor %}
</div>
{% endif %}
