<header class="aurora-topbar px-5 py-4 sticky top-0 z-20">
    <div class="flex items-center justify-between gap-4">
        <div>
            <h1 class="text-lg font-bold text-[#0F172A] tracking-tight">
                {% block page_heading %}{{ page_title|default:"Bảng điều khiển" }}{% endblock %}
            </h1>
            <p class="text-sm text-[#94A3B8] mt-0.5">Nền tảng phân loại ảnh AI</p>
        </div>
        <div class="flex items-center gap-2">
            <a href="{% url 'authentication:profile' %}" class="aurora-btn aurora-btn-ghost text-sm py-2 px-3">
                <i data-lucide="settings" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Hồ sơ</span>
            </a>
            <a href="{% url 'authentication:logout' %}" class="aurora-btn aurora-btn-secondary text-sm py-2 px-3">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Đăng xuất</span>
            </a>
        </div>
    </div>
</header>
