<header class="aurora-topbar aurora-shell-header px-4 md:px-5 lg:px-5 sticky top-0 z-20 flex-shrink-0">
    <div class="flex items-center justify-between gap-3 md:gap-4 w-full h-full">
        <div class="flex items-center gap-3 min-w-0">
            {# Hamburger — mobile only #}
            <button type="button"
                    class="aurora-btn aurora-btn-ghost py-2 px-2.5 md:hidden flex-shrink-0"
                    @click="toggleMobile()"
                    aria-label="Mở menu điều hướng">
                <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
            <div class="min-w-0">
                <h1 class="text-base md:text-lg font-bold text-[#0F172A] tracking-tight truncate">
                    {% block page_heading %}{{ page_title|default:"Bảng điều khiển" }}{% endblock %}
                </h1>
                <p class="text-xs md:text-sm text-[#94A3B8] mt-0.5 truncate hidden sm:block">Nền tảng phân loại ảnh AI</p>
            </div>
        </div>
        <div class="flex items-center gap-1.5 md:gap-2 flex-shrink-0">
            <a href="{% url 'authentication:profile' %}" class="aurora-btn aurora-btn-ghost text-sm py-2 px-2.5 md:px-3">
                <i data-lucide="settings" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Hồ sơ</span>
            </a>
            <a href="{% url 'authentication:logout' %}" class="aurora-btn aurora-btn-secondary text-sm py-2 px-2.5 md:px-3">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Đăng xuất</span>
            </a>
        </div>
    </div>
</header>
